<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>User {{ user_id }} channels</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; background: #f8fafc; }
      h1 { margin-bottom: 6px; }
      .subtitle { color: #475569; margin-bottom: 20px; }
      .channel { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
      .channel h2 { margin: 0 0 8px 0; font-size: 18px; }
      .msg { padding: 8px 10px; background: #f1f5f9; border-radius: 6px; margin: 6px 0; }
      .empty { color: #64748b; }
      .error { color: #b91c1c; background: #fee2e2; padding: 10px; border-radius: 6px; }
      .composer { display: flex; gap: 8px; margin-top: 10px; }
      .composer input { flex: 1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; }
      .composer button { padding: 8px 12px; border: 0; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>User {{ user_id }} Channels</h1>
    <div class="subtitle">User ID: {{ user_id }}</div>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    {% for channel in channels %}
      <div class="channel">
        <h2>#{{ channel.name }}</h2>
        {% if channel.messages %}
          {% for message in channel.messages %}
            <div class="msg">{{ message.text }}</div>
          {% endfor %}
        {% else %}
          <div class="empty">No messages yet.</div>
        {% endif %}
        <form class="composer" method="post" action="/channels/{{ channel.id }}/send">
          <input type="text" name="text" placeholder="Type a message..." required />
          <button type="submit">Send</button>
        </form>
      </div>
    {% endfor %}
  </body>
</html>
