version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initial_data.sql:/docker-entrypoint-initdb.d/initial_data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  msg_service:
    build:
      context: .
      dockerfile: ./msg_service/Dockerfile
    container_name: msg_service_container
    ports:
      - "5001:5000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: testdb
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./msg_service:/app

  alice:
    build:
      context: ./client_app
      dockerfile: Dockerfile
    container_name: alice_container
    ports:
      - "7001:5000"
    environment:
      SERVICE_URL: http://msg_service:5000
      CLIENT_NAME: alice
      USER_ID: 1
    depends_on:
      - msg_service
    volumes:
      - ./client_app:/app

  bob:
    build:
      context: ./client_app
      dockerfile: Dockerfile
    container_name: bob_container
    ports:
      - "7002:5000"
    environment:
      SERVICE_URL: http://msg_service:5000
      CLIENT_NAME: bob
      USER_ID: 2
    depends_on:
      - msg_service
    volumes:
      - ./client_app:/app

  ws_service:
    build:
      context: ./ws_service
      dockerfile: Dockerfile
    container_name: ws_service_container
    ports:
      - "5002:5000"
    volumes:
      - ./ws_service:/app

volumes:
  mysql_data:
