version: '3.8'

services:
  mysql:
    image: mysql:latest
    container_name: mysql_container
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: testdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./initial_data.sql:/docker-entrypoint-initdb.d/initial_data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  msg_service:
    build:
      context: .
      dockerfile: ./msg_service/Dockerfile
    container_name: msg_service_container
    ports:
      - "5001:5000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: testdb
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./msg_service:/app

volumes:
  mysql_data:
